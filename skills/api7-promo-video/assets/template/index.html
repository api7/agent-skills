<!doctype html>
<html lang="{{LANGUAGE}}" data-composition-variables='{{VARIABLES}}'>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TOPIC}}</title>
  <style>
    @font-face{font-family:Inter;src:url('assets/fonts/Inter-400.woff2')}@font-face{font-family:Inter;src:url('assets/fonts/Inter-700.woff2');font-weight:700}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#F7F8FA}#root{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:#F7F8FA}.clip{position:absolute;inset:0}
  </style>
  <script src="assets/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
  {{SCENES}}
  {{AUDIO}}
</div>
<script>window.__timelines=window.__timelines||{};window.__timelines.main=gsap.timeline({paused:true});</script>
</body></html>
